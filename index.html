<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      /* Reseteo general */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #050505; /* Fondo casi negro para contraste de neón */
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* Contenedor general */
      .contenedor {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Estilos para el iframe a pantalla completa */
      #webApp {
        width: 100%;
        height: 100vh;
        border: none;
      }

      /* Estilo de Error 404 con efecto Neón Rojo */
      .error-container {
        text-align: center;
        position: relative;
        padding: 20px;
      }

      /* Líneas horizontales de fondo estilo láser */
      .error-container::before,
      .error-container::after {
        content: "";
        position: absolute;
        left: -50vw;
        right: -50vw;
        height: 3px;
        background-color: #ff0033;
        box-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 40px #ff0033;
        z-index: -1;
      }

      .error-container::before {
        top: 30%;
      }

      .error-container::after {
        bottom: 30%;
      }

      .error-code {
        font-size: 75px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #ffffff;
        text-transform: uppercase;
        /* Efecto de resplandor de neón (glow) */
        text-shadow: 
          0 0 5px #fff, 
          0 0 10px #fff, 
          0 0 20px #ff0033, 
          0 0 40px #ff0033, 
          0 0 80px #ff0033;
        margin-bottom: 15px;
      }

      .error-message {
        font-size: 16px;
        color: #94a3b8;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 10px;
      }
    </style>
    <!-- Título inicial por defecto -->
    <title id="pagina-titulo">Ingenius Cloud</title>
</head>
<body>
    <div class="contenedor" id="contenedor-principal">
        <!-- El contenido se cargará dinámicamente aquí -->
    </div>

    <script>
        // 1. Capturamos los parámetros de la URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const paramId = urlParams.get('id');

        // 2. Diccionario de enlaces permitidos (con las llaves exactas originales)
        const enlacesIframes = {
            "now": "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec",
            "nur": "https://script.google.com/macros/s/AKfycbxZkUmp6Tl3SV9Zq1HJRpw43wyQVGUFpihrK9unu8z-RWODuqIiLwe0gRGMn29X-CKG/exec",
            "cvd": "https://ingeniuscloud.github.io/cv.dev/"
        };

        // 3. Diccionario de títulos personalizados según el ID
        const titulosPagina = {
            "now": "Formulario Now Moving",
            "nur": "Consultorio Sonrisalud",
            "cvd": "CV Jesús Aguilera Dev"
        };

        const contenedor = document.getElementById('contenedor-principal');
        const elementoTitulo = document.getElementById('pagina-titulo');

        // 4. Validación, renderizado dinámico y actualización del título de la pestaña
        if (paramId && enlacesIframes[paramId]) {
            contenedor.innerHTML = `<iframe id="webApp" src="${enlacesIframes[paramId]}"></iframe>`;
            elementoTitulo.innerText = titulosPagina[paramId] || paramId;
        } else {
            elementoTitulo.innerText = "Ingenius Cloud";
            contenedor.innerHTML = `
                <div class="error-container">
                    <div class="error-code">ERROR 404</div>
                    <div class="error-message">Acceso no válido o enlace incompleto</div>
                    <span class="error-badge">Ingenius Cloud • Soporte</span>
                </div>
            `;
        }
    </script>
</body>
</html>
