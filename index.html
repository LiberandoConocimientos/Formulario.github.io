<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      /* Estilos para el contenedor */
      .contenedor {
        margin: 0;
        padding: 0;
      }

      /* Estilos para el iframe */
      #webApp {
        width: 100%;
        height: 100vh;
        border: none;
      }
    </style>
    <title>Formulario Now Moving</title>
</head>
<body>
    <div class="contenedor">
        <iframe id="webApp" src=""> </iframe>
    </div>

    <script>
        // 1. Capturamos los parámetros que vienen en la URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        
        // 2. Leemos el parámetro llamado 'id' (puedes cambiarlo por el nombre que prefieras)
        const paramId = urlParams.get('id');

        // 3. Definimos los diferentes enlaces de los iframes según el número recibido
        const enlacesIframes = {
            "1": "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec",
            "2": "https://script.google.com/macros/s/AKfycbxZkUmp6Tl3SV9Zq1HJRpw43wyQVGUFpihrK9unu8z-RWODuqIiLwe0gRGMn29X-CKG/exec,
            "3": "https://miel-sevaliente.github.io/Miel/",
            "4": "https://www.youtube.com/watch?v=zaznPoyfI6w"
        };

        // 4. Seleccionamos el iframe en el HTML
        const iframeElement = document.getElementById('webApp');

        // 5. Asignamos el enlace correspondiente; si no existe el parámetro o el número no es válido, ponemos uno por defecto
        if (paramId && enlacesIframes[paramId]) {
            iframeElement.src = enlacesIframes[paramId];
        } else {
            // Enlace por defecto si no envían parámetro o no coincide
            iframeElement.src = "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec";
        }
    </script>
</body>
</html>
