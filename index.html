<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      /* Reseteo general y tipografía elegante */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #0f172a; /* Fondo oscuro elegante */
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* Contenedor general */
      .contenedor {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Estilos para el iframe a pantalla completa */
      #webApp {
        width: 100%;
        height: 100vh;
        border: none;
      }

      /* Tarjeta de Error 404 vistosa y moderna */
      .error-card {
        background: #1e293b;
        border: 1px solid #334155;
        padding: 40px 50px;
        border-radius: 16px;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        max-width: 480px;
        width: 90%;
        animation: fadeIn 0.5s ease-in-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .error-code {
        font-size: 80px;
        font-weight: 800;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        line-height: 1;
        margin-bottom: 15px;
      }

      .error-title {
        font-size: 22px;
        font-weight: 600;
        color: #f1f5f9;
        margin-bottom: 10px;
      }

      .error-message {
        font-size: 15px;
        color: #94a3b8;
        line-height: 1.5;
        margin-bottom: 25px;
      }

      .error-badge {
        display: inline-block;
        background-color: #334155;
        color: #38bdf8;
        font-size: 12px;
        font-weight: 500;
        padding: 6px 12px;
        border-radius: 20px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
    </style>
    <!-- Título inicial por defecto -->
    <title id="pagina-titulo">Ingenius Cloud</title>
</head>
<body>
    <div class="contenedor" id="contenedor-principal">
        <!-- El contenido se cargará dinámicamente aquí -->
    </div>

    <script>
        // 1. Capturamos los parámetros de la URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const paramId = urlParams.get('id');

        // 2. Diccionario de enlaces permitidos
        const enlacesIframes = {
            "Now": "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec",
            "Nur": "https://script.google.com/macros/s/AKfycbxZkUmp6Tl3SV9Zq1HJRpw43wyQVGUFpihrK9unu8z-RWODuqIiLwe0gRGMn29X-CKG/exec",
            "Cv": "https://ingeniuscloud.github.io/cv.dev/"
        };

        // 3. Diccionario de títulos personalizados según el ID
        const titulosPagina = {
            "Now": "Formulario Now Moving",
            "Nur": "Consultorio Sonrisalud",
            "Cv": "CV Jesús Aguilera Dev"
        };

        const contenedor = document.getElementById('contenedor-principal');
        const elementoTitulo = document.getElementById('pagina-titulo');

        // 4. Validación, renderizado dinámico y actualización del título de la pestaña
        if (paramId && enlacesIframes[paramId]) {
            contenedor.innerHTML = `<iframe id="webApp" src="${enlacesIframes[paramId]}"></iframe>`;
            // Asigna el título específico o el ID por defecto si no estuviera en el diccionario
            elementoTitulo.innerText = titulosPagina[paramId] || paramId;
        } else {
            elementoTitulo.innerText = "Ingenius Cloud";
            contenedor.innerHTML = `
                <div class="error-card">
                    <div class="error-code">404</div>
                    <div class="error-title">Acceso no válido o enlace incompleto</div>
                    <p class="error-message">Lo sentimos, el parámetro proporcionado en la URL no es correcto o no existe un formulario asociado a él.</p>
                    <span class="error-badge">Ingenius Cloud • Soporte</span>
                </div>
            `;
        }
    </script>
</body>
</html>
